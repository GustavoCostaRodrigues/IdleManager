appId: com.gustavo.pokeidlemanager
productName: Poke Idle Manager
copyright: Copyright © 2026 Gustavo

directories:
  output: release
  buildResources: build

# Tudo é empacotado pelo esbuild em dist/ — não há node_modules de runtime.
files:
  - dist/**/*
  - package.json

asar: true

mac:
  category: public.app-category.games
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64, arm64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
